<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cờ Tỷ Phú — Sài Gòn · Gia Định</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%237C1E14'/%3E%3Cpath d='M16 5l2.6 7.4H26l-6 4.6 2.3 7.4L16 20l-6.3 4.4L12 17l-6-4.6h7.4z' fill='%23E9CE85'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/fonts/fonts.css" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <!-- Phaser mounts here: board, tokens, dice, particles -->
    <div id="game-canvas"></div>

    <!-- HTML overlay: một cột điều khiển duy nhất + mặt bàn cờ -->
    <div id="ui">
      <aside id="sidebar">
        <div class="brand">
          <span class="brand-mark">✦</span>
          <span class="brand-text">
            <b>CỜ TỶ PHÚ</b>
            <i>Sài Gòn · Gia Định</i>
          </span>
        </div>

        <!-- Thẻ lớn cho người đang tới lượt, bên dưới là cả bàn xếp hàng ngang -->
        <div id="turn-panel">
          <div id="players"></div>
          <div id="roster"></div>
        </div>

        <!-- Xem nhanh ô đang rê chuột trên bàn cờ -->
        <section id="quickview"></section>

        <!-- Thanh Thời Cuộc: đầy tới ngưỡng là nổ một thẻ sự kiện.
             Ẩn hẳn khi ván tắt tính năng này. -->
        <div id="fate-meter" hidden>
          <div class="fm-head">
            <span class="fm-label">THỜI CUỘC</span>
            <span class="fm-state"></span>
          </div>
          <div class="fm-bar"><i></i></div>
          <div class="fm-note"></div>
        </div>

        <div class="side-foot">
          <div id="bank-plate">
            <span class="bank-label">NGÂN HÀNG</span>
            <span id="bank-houses">32 nhà</span>
          </div>
          <div class="side-tools">
            <button class="icon-btn" id="music-toggle" title="Bật/tắt nhạc nền (M)" aria-label="Bật/tắt nhạc nền">♪</button>
            <button class="icon-btn" id="sfx-toggle" title="Bật/tắt hiệu ứng âm thanh" aria-label="Bật/tắt hiệu ứng âm thanh">🔔</button>
            <button class="icon-btn" id="meme-btn" title="Thả meme lên bàn cờ (G · phím 1-0 thả thẳng 10 meme đầu)" aria-label="Thả meme lên bàn cờ">😂</button>
            <button class="icon-btn" id="fullscreen-toggle" title="Toàn màn hình (F)" aria-label="Toàn màn hình">⛶</button>
          </div>
        </div>
      </aside>

      <!-- Lớp phủ khớp đúng ô vuông bàn cờ: thông báo trên đầu,
           thanh nút hành động nằm giữa lòng bàn cờ.
           Toạ độ do BoardScene.layout() bơm vào. -->
      <div id="board-hud">
        <!-- Bản online: đường truyền của máy này đứt. Ẩn cho tới khi có chuyện. -->
        <div id="link-warn" role="status" aria-live="polite">
          <span class="lw-dot"></span>
          <span class="lw-text"><b>Mất kết nối</b> — đang nối lại…</span>
        </div>
        <!-- Bản online: đồng hồ của người đang phải ra quyết định. Cả bàn cùng
             nhìn một vòng cung nên ai cũng biết còn bao lâu, kể cả người ngồi xem. -->
        <div id="turn-clock" role="timer">
          <div class="tc-dial">
            <svg class="tc-ring" viewBox="0 0 100 100" aria-hidden="true">
              <circle class="tc-track" cx="50" cy="50" r="44"></circle>
              <circle class="tc-arc" cx="50" cy="50" r="44"></circle>
            </svg>
            <span class="tc-num">–</span>
          </div>
          <span class="tc-who"></span>
        </div>
        <div id="broadcast"></div>
        <footer id="actions"></footer>
      </div>
    </div>

    <!-- Bong bóng meme neo theo quân cờ — toạ độ do ui/memes.js bơm vào,
         nằm ngoài #board-hud vì quân cờ đứng trên vành bàn, sát mép ô vuông. -->
    <div id="meme-layer"></div>

    <!-- Modals render here -->
    <div id="modal-root"></div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
