# Máy chủ ván cờ: một Worker trước cửa, mỗi phòng một Durable Object.
# Chạy thử trên máy: `npm run server` (wrangler dev, cổng 8787) — không cần tài
# khoản Cloudflare. Deploy thật: `npx wrangler deploy` sau khi `wrangler login`.
name = "monopoly-rooms"
main = "src/index.js"
compatibility_date = "2025-06-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "GameRoom"

# Gói free chỉ dùng được Durable Object kiểu SQLite
[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]

