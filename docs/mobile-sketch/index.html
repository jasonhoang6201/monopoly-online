<!-- Font thật của game khi mở qua dev server; mở bằng file:// thì rơi về font hệ thống -->

<style>
/* ============================================================
   PHÁC THẢO MOBILE — chỉ để tham khảo, không phải mã game.
   Bảng màu chép từ src/style.css; màu khu chép từ src/data/board.js.
   ============================================================ */
:root {
  --lac-deep:#5E140E; --lac:#8B2318; --lac-light:#A93425;
  --gold-deep:#8A6A22; --gold:#C8A048; --gold-light:#E6C878; --gold-pale:#F2DFAE;
  --jade-deep:#1D4436; --jade:#2E6B52; --jade-light:#4E9576;
  --paper:#EFE2C6; --paper-warm:#E4D2AC; --paper-deep:#D2BC90;
  --indigo-deep:#101B33; --indigo:#1D2E52; --indigo-mid:#2C4374;
  --ground-night:#150A06; --ground-deep:#1B0B07; --ground:#30150F; --ground-light:#4A241A;
  --ink:#17110C; --ink-soft:#3A2E22;
  --ok:#3F8F5F; --bad:#B3322A;
  --display:"Playfair Display", Georgia, serif;
  --serif:"Noto Serif", Georgia, serif;
  --sans:"Be Vietnam Pro", ui-sans-serif, -apple-system, "Segoe UI", sans-serif;
  --ease-back:cubic-bezier(.18,.89,.32,1.28);
  --ease:cubic-bezier(.4,0,.2,1);
  /* bề ngang hai cột điều khiển; bàn cờ ăn phần còn lại */
  --left:118px; --right:148px;
  --tap:44px; /* mục tiêu chạm tối thiểu */
}
/* Hai chủ đề thử nhận diện: chỉ đổi vài biến nền/nhấn như src/theme/*.css */
#app[data-theme="christmas"] { --lac:#163C5A; --lac-deep:#0C2338; --lac-light:#245A82; --ground:#0F1E2C; --ground-deep:#0A141E; --ground-night:#060D14; --gold:#D8E6EE; --gold-light:#F0F6F9; --gold-deep:#8FA7B5; }
#app[data-theme="halloween"] { --lac:#4A1F6B; --lac-deep:#2C1140; --lac-light:#6A2E97; --ground:#1D1026; --ground-deep:#130A1A; --ground-night:#0A0510; --gold:#E88A2E; --gold-light:#F5B36A; --gold-deep:#9E5A18; }

* { box-sizing:border-box; margin:0; padding:0; }
html, body { height:100%; background:#0a0605; color:var(--paper); font-family:var(--sans); overflow:hidden;
  -webkit-tap-highlight-color:transparent; -webkit-text-size-adjust:100%; }
button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; touch-action:manipulation; }

/* ---------- Khung xem trên máy tính ---------- */
#deskbar { position:fixed; inset:0 0 auto 0; height:48px; display:flex; align-items:center; gap:14px; padding:0 16px;
  background:#120907; border-bottom:1px solid #3a2118; font-size:13px; z-index:5; }
#deskbar .brand { font-family:var(--display); color:var(--gold-light); font-weight:700; letter-spacing:.04em; }
#deskbar .grp { display:flex; gap:4px; align-items:center; }
#deskbar label { color:#a08a6a; font-size:11px; text-transform:uppercase; letter-spacing:.08em; margin-right:4px; white-space:nowrap; }
#deskbar button { padding:6px 10px; border-radius:6px; background:#2a1711; color:var(--paper); font-size:12px; }
#deskbar button.on { background:var(--gold); color:var(--ink); font-weight:600; }
#deskbar .hint { margin-left:auto; color:#8f7a5c; font-size:12px; }
#stage { position:fixed; inset:48px 0 0 0; display:grid; place-items:center; overflow:hidden; }
#phone { position:relative; width:874px; height:402px; background:#000; border-radius:28px; padding:12px;
  box-shadow:0 30px 80px rgba(0,0,0,.7), 0 0 0 2px #2a2a2a inset; transform-origin:center; }
#phone::before { /* "đảo động" của iPhone, chỉ để nhìn cho quen mắt */
  content:""; position:absolute; left:22px; top:50%; width:10px; height:70px; margin-top:-35px;
  background:#000; border-radius:8px; z-index:3; box-shadow:0 0 0 2px #111; }
#phone[data-notch="no"]::before { display:none; }
/* iPhone có đảo động chừa ~59pt mỗi bên khi nằm ngang (safe-area-inset) — mô phỏng để thấy đúng phần đất còn lại */
#phone[data-notch="yes"] #app { padding-left:59px; padding-right:59px; }
#phone .screen { width:100%; height:100%; border-radius:18px; overflow:hidden; position:relative; }
.dims { position:absolute; bottom:-26px; left:0; right:0; text-align:center; color:#6f5c45; font-size:11px; }

/* Trên điện thoại thật: bỏ khung, chiếm trọn màn */
body.phone #deskbar { display:none; }
body.phone #stage { inset:0; }
body.phone #phone { width:100dvw; height:100dvh; border-radius:0; padding:0; box-shadow:none; }
body.phone #phone::before, body.phone .dims { display:none; }
body.phone #phone .screen { border-radius:0; }
body.phone #app { padding-left:env(safe-area-inset-left); padding-right:env(safe-area-inset-right); }

#rotate { display:none; position:fixed; inset:0; z-index:50; background:var(--ground-night); color:var(--gold-light);
  place-items:center; text-align:center; font-family:var(--display); font-size:22px; padding:30px; line-height:1.4; }
#rotate small { display:block; font-family:var(--sans); font-size:13px; color:#b89d74; margin-top:10px; }
#rotate .ph { font-size:60px; display:block; animation:spin 2.4s var(--ease) infinite; }
@keyframes spin { 0%,20%{transform:rotate(0)} 60%,100%{transform:rotate(90deg)} }
body.portrait #rotate { display:grid; }

/* ---------- Ứng dụng ---------- */
#app { position:absolute; inset:0; display:grid; grid-template-columns:var(--left) 1fr var(--right);
  background:radial-gradient(120% 90% at 50% 40%, var(--ground) 0%, var(--ground-deep) 60%, var(--ground-night) 100%);
  overflow:hidden; font-size:12px; }
#app::after { /* vân sơn mài rất nhẹ */
  content:""; position:absolute; inset:0; pointer-events:none; opacity:.12;
  background:repeating-linear-gradient(115deg, transparent 0 14px, rgba(255,220,160,.08) 14px 15px); }

/* Cột trái: người chơi */
#left { display:flex; flex-direction:column; padding:6px 6px 6px 8px; gap:5px; min-height:0; z-index:1; }
.logo { font-family:var(--display); font-weight:800; font-size:11px; letter-spacing:.06em; color:var(--gold-light);
  text-align:center; line-height:1.1; padding:3px 0 2px; border-bottom:1px solid rgba(200,160,72,.28); }
.logo small { display:block; font-family:var(--sans); font-weight:500; font-size:8px; letter-spacing:.18em; color:var(--gold-deep); }
#players { display:flex; flex-direction:column; gap:5px; }
.pcard { position:relative; display:flex; width:100%; align-items:center; gap:6px; min-height:var(--tap); padding:4px 6px;
  border-radius:9px; background:rgba(0,0,0,.28); border:1px solid rgba(200,160,72,.18); text-align:left;
  transition:transform .15s var(--ease); }
.pcard:active { transform:scale(.97); }
.pcard.cur { border-color:var(--gold); background:linear-gradient(180deg, rgba(200,160,72,.22), rgba(200,160,72,.08)); box-shadow:0 0 0 1px rgba(200,160,72,.35), 0 4px 12px rgba(0,0,0,.4); }
.pcard .tok { flex:0 0 22px; width:22px; height:22px; border-radius:50%; display:grid; place-items:center; font-weight:700; font-size:11px; color:#fff;
  box-shadow:0 0 0 2px rgba(0,0,0,.4), 0 2px 4px rgba(0,0,0,.5); text-shadow:0 1px 1px rgba(0,0,0,.6); }
.pcard .who { min-width:0; flex:1; }
.pcard .nm { font-weight:600; font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; line-height:1.1; }
.pcard .cash { font-family:var(--serif); font-weight:700; font-size:13px; color:var(--gold-light); line-height:1.15; font-variant-numeric:tabular-nums; }
.pcard .tags { display:flex; gap:3px; flex-wrap:wrap; margin-top:1px; }
.tag { font-size:7.5px; font-weight:700; letter-spacing:.06em; padding:1px 4px; border-radius:3px; background:rgba(0,0,0,.4); color:var(--paper-deep); text-transform:uppercase; }
.tag.jail { background:var(--indigo); color:#cdd8f5; }
.tag.cards { background:var(--jade-deep); color:#bfe6cf; }
.tag.debt { background:var(--bad); color:#fff; }
.pcard .turn { position:absolute; top:-6px; right:6px; font-size:7px; font-weight:800; letter-spacing:.12em; padding:1px 5px; border-radius:3px;
  background:var(--gold); color:var(--ink); }
#left .util { margin-top:auto; display:flex; gap:4px; }
#left .util button { flex:1; min-height:36px; border-radius:8px; background:rgba(0,0,0,.3); border:1px solid rgba(200,160,72,.18); font-size:15px; }
#left .util button:active { background:rgba(200,160,72,.25); }

/* Giữa: bàn cờ */
#mid { position:relative; display:grid; place-items:center; min-width:0; min-height:0; padding:6px 4px; z-index:1; }
#board { position:relative; width:min(100%, calc(100cqh - 0px)); aspect-ratio:1; display:grid;
  grid-template-columns:1.45fr repeat(9,1fr) 1.45fr; grid-template-rows:1.45fr repeat(9,1fr) 1.45fr;
  background:var(--paper-warm); border:3px solid var(--gold-deep); border-radius:6px; gap:1px; padding:1px;
  box-shadow:0 0 0 1px var(--lac-deep), 0 16px 40px rgba(0,0,0,.6);
  font-family:var(--serif); color:var(--ink); }
#mid { container-type:size; }
#board { width:min(100%, 100cqh); }
.tile { position:relative; background:var(--paper); display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
  overflow:hidden; cursor:pointer; -webkit-user-select:none; user-select:none; font-size:6.4px; line-height:1.05; text-align:center; padding:1px; }
.tile:active { filter:brightness(.92); }
.tile .strip { position:absolute; background:var(--g); }
.tile[data-side="b"] .strip { left:0; right:0; top:0; height:22%; }
.tile[data-side="l"] .strip { top:0; bottom:0; right:0; width:22%; }
.tile[data-side="t"] .strip { left:0; right:0; bottom:0; height:22%; }
.tile[data-side="r"] .strip { top:0; bottom:0; left:0; width:22%; }
.tile .nm { position:absolute; inset:0; display:grid; place-items:center; padding:2px; font-weight:600; letter-spacing:-.01em; hyphens:auto; }
.tile[data-side="b"] .nm { top:24%; } .tile[data-side="t"] .nm { bottom:24%; }
/* cột trái/phải: chừa 12px mép ngoài cho quân cờ và chấm chủ đất */
.tile[data-side="l"] .nm { right:24%; left:12px; } .tile[data-side="r"] .nm { left:24%; right:12px; }
.tile .pr { position:absolute; font-size:5.6px; color:var(--ink-soft); font-variant-numeric:tabular-nums; }
.tile[data-side="b"] .pr { bottom:1px; } .tile[data-side="t"] .pr { top:1px; }
.tile[data-side="l"] .pr { left:1px; bottom:1px; } .tile[data-side="r"] .pr { right:1px; bottom:1px; }
.tile.corner { font-size:6.8px; font-weight:800; font-family:var(--display); background:var(--paper-deep); justify-content:center; }
.tile.corner .gl { font-size:14px; line-height:1; margin-bottom:2px; }
.tile.corner .nm { position:static; display:block; padding:0 2px; }
/* ô đặc biệt: ký hiệu ở mép trên, tên lùi xuống dưới ký hiệu để không đè nhau */
.tile.special .gl { font-size:9px; line-height:1; position:absolute; top:2px; }
.tile.special:not(.corner) .nm { top:11px; }
.tile.here { outline:2px solid var(--gold); outline-offset:-2px; box-shadow:inset 0 0 0 20px rgba(200,160,72,.18); }
.tile.sel { outline:2px solid var(--lac-light); outline-offset:-2px; }
/* chủ đất: một chấm nhỏ ở mép ngoài */
.tile .own { position:absolute; width:5px; height:5px; border-radius:50%; box-shadow:0 0 0 1px #fff; }
.tile[data-side="b"] .own { bottom:2px; right:2px; } .tile[data-side="t"] .own { top:2px; right:2px; }
.tile[data-side="l"] .own { left:2px; top:2px; } .tile[data-side="r"] .own { right:2px; top:2px; }
.tile .hs { position:absolute; display:flex; gap:1px; }
.tile[data-side="b"] .hs { top:1px; left:2px; } .tile[data-side="t"] .hs { bottom:1px; left:2px; }
.tile[data-side="l"] .hs { right:1px; top:2px; flex-direction:column; } .tile[data-side="r"] .hs { left:1px; top:2px; flex-direction:column; }
.tile .hs i { width:3px; height:3px; background:var(--jade); border-radius:1px; }
.tile .hs i.hotel { width:7px; background:var(--lac); }
/* quân cờ nằm sát mép ngoài (phía giá tiền), chừa phần tên ô */
.tile .toks { position:absolute; display:flex; gap:1px; z-index:2; }
.tile[data-side="b"] .toks, .tile[data-side="t"] .toks, .tile.corner .toks { left:50%; transform:translateX(-50%); bottom:1px; }
.tile[data-side="t"] .toks { bottom:auto; top:1px; }
.tile[data-side="l"] .toks, .tile[data-side="r"] .toks { top:50%; transform:translateY(-50%); left:2px; flex-direction:column; }
.tile[data-side="r"] .toks { left:auto; right:2px; }
.tile.corner .toks { bottom:3px; }
.tk { width:9px; height:9px; border-radius:50%; box-shadow:0 0 0 1.5px #fff, 0 1px 3px rgba(0,0,0,.6); transition:transform .12s; }
.tk.bump { transform:scale(1.35); }

#center { grid-column:2/11; grid-row:2/11; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
  background:
    radial-gradient(60% 60% at 50% 50%, rgba(139,35,24,.12), transparent 70%),
    var(--paper-warm);
  position:relative; }
#center .title { font-family:var(--display); font-weight:800; color:var(--lac); font-size:clamp(11px, 4.2cqh, 20px); letter-spacing:.08em; line-height:1; }
#center .sub { font-size:7px; letter-spacing:.3em; color:var(--gold-deep); text-transform:uppercase; }
#dice { display:flex; gap:8px; margin:4px 0; }
.die { width:30px; height:30px; border-radius:6px; background:#fff; border:1px solid #c9b48a; display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr);
  padding:4px; gap:1px; box-shadow:0 3px 6px rgba(0,0,0,.25); transition:transform .15s; }
.die i { border-radius:50%; background:var(--ink); opacity:0; }
.die[data-v="1"] i:nth-child(5), .die[data-v="3"] i:nth-child(5), .die[data-v="5"] i:nth-child(5) { opacity:1; }
.die[data-v="2"] i:nth-child(1), .die[data-v="2"] i:nth-child(9), .die[data-v="3"] i:nth-child(1), .die[data-v="3"] i:nth-child(9),
.die[data-v="4"] i:nth-child(1), .die[data-v="4"] i:nth-child(3), .die[data-v="4"] i:nth-child(7), .die[data-v="4"] i:nth-child(9),
.die[data-v="5"] i:nth-child(1), .die[data-v="5"] i:nth-child(3), .die[data-v="5"] i:nth-child(7), .die[data-v="5"] i:nth-child(9),
.die[data-v="6"] i:nth-child(1), .die[data-v="6"] i:nth-child(3), .die[data-v="6"] i:nth-child(4), .die[data-v="6"] i:nth-child(6), .die[data-v="6"] i:nth-child(7), .die[data-v="6"] i:nth-child(9) { opacity:1; }
.die.roll { animation:tumble .12s linear infinite; }
@keyframes tumble { 0%{transform:rotate(0) translateY(0)} 50%{transform:rotate(12deg) translateY(-3px)} 100%{transform:rotate(-10deg) translateY(0)} }
#bcast { min-height:26px; display:flex; flex-direction:column; align-items:center; gap:2px; text-align:center; }
.bc { background:var(--lac); color:var(--gold-pale); padding:2px 8px; border-radius:4px; font-family:var(--sans); font-size:7.5px; max-width:92%;
  box-shadow:0 2px 6px rgba(0,0,0,.35); animation:pop .3s var(--ease-back); }
.bc b { display:block; font-size:7px; letter-spacing:.14em; color:var(--gold-light); }
@keyframes pop { from{transform:scale(.8); opacity:0} to{transform:none; opacity:1} }
#hereChip { position:absolute; bottom:6px; left:50%; transform:translateX(-50%); font-size:7px; color:var(--ink-soft); background:rgba(255,255,255,.55);
  padding:2px 7px; border-radius:10px; white-space:nowrap; }
#hereChip b { color:var(--lac); }

/* Cột phải: hành động */
#right { display:flex; flex-direction:column; gap:5px; padding:6px 8px 6px 6px; min-height:0; z-index:1; }
.primary { min-height:50px; border-radius:12px; font-family:var(--display); font-weight:800; font-size:14px; letter-spacing:.03em;
  background:linear-gradient(180deg, var(--gold-light), var(--gold)); color:var(--ink);
  box-shadow:0 4px 0 var(--gold-deep), 0 8px 18px rgba(0,0,0,.45); transition:transform .1s, box-shadow .1s; line-height:1.1; padding:4px; }
.primary small { display:block; font-family:var(--sans); font-weight:500; font-size:8px; letter-spacing:.12em; opacity:.7; text-transform:uppercase; }
.primary:active { transform:translateY(3px); box-shadow:0 1px 0 var(--gold-deep), 0 4px 10px rgba(0,0,0,.45); }
.primary.pulse { animation:pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 0%,100%{filter:brightness(1)} 50%{filter:brightness(1.15)} }
.primary.end { background:linear-gradient(180deg, var(--lac-light), var(--lac)); color:var(--gold-pale); box-shadow:0 4px 0 var(--lac-deep), 0 8px 18px rgba(0,0,0,.45); }
.primary.end:active { box-shadow:0 1px 0 var(--lac-deep), 0 4px 10px rgba(0,0,0,.45); }
.acts { display:grid; grid-template-columns:1fr 1fr; gap:4px; }
.act { position:relative; min-height:var(--tap); border-radius:9px; background:rgba(0,0,0,.3); border:1px solid rgba(200,160,72,.22);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; padding:3px 2px; line-height:1.05; }
.act .ic { font-size:15px; line-height:1; }
.act .lb { font-size:8.5px; font-weight:600; }
.act .ct { font-size:7px; color:var(--gold-deep); }
.act:active { background:rgba(200,160,72,.25); }
.act.dim { opacity:.4; }
.act .badge { position:absolute; top:-4px; right:-3px; min-width:14px; height:14px; border-radius:7px; background:var(--gold); color:var(--ink);
  font-size:8px; font-weight:800; display:grid; place-items:center; padding:0 3px; }
.act .badge.hot { background:var(--bad); color:#fff; }
#fate { padding:5px 6px; border-radius:9px; background:rgba(0,0,0,.3); border:1px solid rgba(200,160,72,.18); }
#fate .lb { display:flex; justify-content:space-between; font-size:7.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--gold-deep); font-weight:700; }
#fate .bar { height:6px; margin-top:3px; border-radius:3px; background:rgba(0,0,0,.5); overflow:hidden; }
#fate .bar i { display:block; height:100%; width:62%; background:linear-gradient(90deg, var(--jade), var(--gold), var(--lac-light)); transition:width .4s; }
#clock { display:flex; align-items:center; gap:6px; font-size:9px; color:var(--paper-deep); }
#clock .ring { width:22px; height:22px; border-radius:50%; display:grid; place-items:center; font-size:7.5px; font-weight:700; color:var(--gold-light);
  background:conic-gradient(var(--gold) var(--p, 60%), rgba(255,255,255,.12) 0); position:relative; }
#clock .ring::after { content:""; position:absolute; inset:3px; border-radius:50%; background:var(--ground-deep); }
#clock .ring span { position:relative; z-index:1; }
/* nhật ký lượt: broadcast trên bàn tắt sau vài giây, trên điện thoại cần chỗ xem lại */
#log { flex:1; min-height:0; overflow:hidden; display:flex; flex-direction:column; justify-content:flex-end; gap:2px; padding:4px 2px; font-size:8.5px; line-height:1.25; color:var(--paper-deep); }
#log div { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#log div b { color:var(--gold-light); font-weight:600; }
#log div:last-child { color:var(--paper); }
#clock .nm { font-weight:600; color:var(--paper); }

/* ---------- Lớp phủ ---------- */
#scrim { position:absolute; inset:0; z-index:8; background:rgba(8,4,2,.5); opacity:0; pointer-events:none; transition:opacity .2s; }
#scrim.on { opacity:1; pointer-events:auto; }
.sheet { position:absolute; top:0; bottom:0; width:min(340px, 58%); z-index:9; background:linear-gradient(180deg, #221009, #170a06); border-left:1px solid rgba(200,160,72,.35);
  box-shadow:-10px 0 30px rgba(0,0,0,.5); transform:translateX(100%); transition:transform .25s var(--ease); display:flex; flex-direction:column; }

/* ---------- Bàn cờ ---------- */
function tileSide(i) { return i<=10 ? 'b' : i<=20 ? 'l' : i<=30 ? 't' : 'r'; }
function tilePos(i) { if (i<=10) return [11-i, 11]; if (i<=20) return [1, 11-(i-10)]; if (i<=30) return [1+(i-20), 1]; return [11, 1+(i-30)]; }
function buildBoard() {
  const b = $('#board'); b.innerHTML = '';
  for (const t of BOARD) {
    const [c, r] = tilePos(t.id); const el = document.createElement('div');
    const corner = t.type==='corner'; el.className = 'tile' + (corner?' corner':'') + (t.ownable?'':' special');
    el.dataset.id = t.id; el.dataset.side = tileSide(t.id); el.style.gridColumn = c; el.style.gridRow = r;
    if (t.g) el.style.setProperty('--g', GROUPS[t.g].hex);
    let inner = '';
    if (t.g) inner += '<div class="strip"></div>';
    if (t.glyph) inner += `<div class="gl">${t.glyph}</div>`;
    inner += `<div class="nm">${corner ? t.name : t.vi}</div>`;
    if (t.ownable) inner += `<div class="pr">${t.p}$</div>`;
    inner += '<div class="own"></div><div class="hs"></div><div class="toks"></div>';
    el.innerHTML = inner; el.onclick = () => openTile(t.id); b.appendChild(el);
  }
  const c = document.createElement('div'); c.id = 'center';
  c.innerHTML = `<div class="title">CỜ TỶ PHÚ</div><div class="sub">Sài Gòn · Gia Định</div>
    <div id="dice"><div class="die" data-v="3">${'<i></i>'.repeat(9)}</div><div class="die" data-v="4">${'<i></i>'.repeat(9)}</div></div>
    <div id="bcast"></div><div id="hereChip"></div>`;
  b.appendChild(c);
}
function paintBoard() {
  for (const t of BOARD) {
    const el = $(`.tile[data-id="${t.id}"]`); const o = S.owner[t.id];
    const own = $('.own', el); own.style.display = o==null ? 'none' : ''; if (o!=null) own.style.background = S.players[o].color;
    const h = S.houses[t.id]||0; $('.hs', el).innerHTML = h===5 ? '<i class="hotel"></i>' : '<i></i>'.repeat(h);
    el.classList.toggle('here', me().pos===t.id); el.classList.toggle('sel', S.sel===t.id);
    el.style.opacity = S.mortgaged.has(t.id) ? .55 : '';
    $('.toks', el).innerHTML = S.players.map((p,i)=> p.pos===t.id ? `<div class="tk" data-p="${i}" style="background:${p.color}"></div>` : '').join('');
  }
  const here = BOARD[me().pos];
  $('#hereChip').innerHTML = `<b>${me().name}</b> đang ở ${here.vi}${here.ownable && owned(here.id)!=null ? ' · của '+S.players[owned(here.id)].name : ''}`;
}

/* ---------- Broadcast / toast ---------- */
function bcast(title, line) {
  const el = document.createElement('div'); el.className = 'bc'; el.innerHTML = `<b>${title}</b>${line||''}`;
  const box = $('#bcast'); box.appendChild(el); while (box.children.length > 2) box.firstChild.remove();
  setTimeout(() => el.remove(), 3400);
  const log = $('#log'); log.insertAdjacentHTML('beforeend', `<div><b>${title}</b> ${line||''}</div>`); while (log.children.length > 6) log.firstChild.remove();
}
let toastT; function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove('on'), 2200); }

function deedHTML(id) {
  const t = BOARD[id]; const o = owned(id); const hex = t.g ? GROUPS[t.g].hex : t.type==='station' ? '#27418C' : '#2E6B52';
  let rows = '';
  if (t.type==='property') { const h=S.houses[id]||0; const lb=['Đất trống','1 nhà','2 nhà','3 nhà','4 nhà','Khách sạn'];
    rows = RENTS[id].map((r,i)=>`<tr class="${o!=null&&i===h?'now':''}"><td>${lb[i]}${i===0&&o!=null&&hasSet(o,t.g)?' · trọn bộ ×2':''}</td><td>${money(i===0&&o!=null&&hasSet(o,t.g)?r*2:r)}</td></tr>`).join('');
    rows += `<tr><td>Giá xây mỗi nhà</td><td>${money(t.h)}</td></tr>`; }
  else if (t.type==='station') rows = [1,2,3,4].map(n=>`<tr><td>Có ${n} bến / ga</td><td>${money([0,25,50,100,200][n])}</td></tr>`).join('');
  else rows = `<tr><td>Có 1 ô công ích</td><td>4 × xí ngầu</td></tr><tr><td>Có 2 ô công ích</td><td>10 × xí ngầu</td></tr>`;
  return `<div class="deed"><div class="top" style="background:${hex}">${t.vi}<small>${t.name}${t.g?' · '+GROUPS[t.g].name:''}</small></div>
    <table>${rows}</table><div class="foot"><span>Giá ${money(t.p)}</span><span>Thế chấp ${money(t.p/2)}</span></div></div>`;
}
function openTile(id) {
  const t = BOARD[id]; S.sel = id; paintBoard();
  const o = owned(id); const mine = o===S.cur; const here = S.players.filter(p=>p.pos===id);
  let body = '';
  if (t.ownable) {
    body += deedHTML(id);
    body += `<div class="sec">Tình trạng</div>
      <div class="kv"><span>Chủ đất</span><b>${o==null?'Chưa ai':S.players[o].name}${S.mortgaged.has(id)?' · ĐÃ THẾ CHẤP':''}</b></div>
      ${o!=null?`<div class="kv"><span>Thuê hiện tại</span><b>${money(rentOf(id))}</b></div>`:''}`;
  } else {
    const txt = {corner:{0:'Đi ngang qua nhận lương 200$. Dừng đúng ô được ×1.5.',10:'Ghé thăm thì không sao. Bị bắt thì 3 lượt hoặc nộp 50$.',20:'Bến đậu an toàn. Quỹ công tích ở đây.',30:'Vào thẳng Khám Lớn, không qua Bắt Đầu.'}[id],
      tax:'Nộp 10% tổng tài sản hoặc 200$, tuỳ ít hơn.', chance:'Bốc một lá Cơ Hội. Có lá được cất vào túi để dùng sau.', chest:'Bốc một lá Khí Vận.'}[t.type];
    body += `<p style="font-size:11.5px">${txt}</p>`;
  }
  if (here.length) body += `<div class="sec">Đang đứng đây</div><div class="chips">${here.map(p=>`<span class="chip"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${p.color};margin-right:4px"></span>${p.name}</span>`).join('')}</div>`;
  let ft = '';
  if (mine && t.type==='property') ft = `<button class="btn gold" data-a="build">Xây nhà · ${money(t.h)}</button><button class="btn" data-a="mort">${S.mortgaged.has(id)?'Chuộc lại':'Thế chấp'}</button>`;
  else if (mine) ft = `<button class="btn" data-a="mort">${S.mortgaged.has(id)?'Chuộc lại':'Thế chấp'}</button>`;
  else if (o!=null && o!==S.cur) ft = `<button class="btn" data-a="trade">Hỏi mua từ ${S.players[o].name}</button>`;
  const el = sheet('R', `<div style="width:10px;height:36px;border-radius:3px;background:${t.g?GROUPS[t.g].hex:'var(--gold-deep)'}"></div><h3>${t.vi}<small>Ô ${id} · ${t.name}</small></h3>`, body, ft);
  el.querySelectorAll('[data-a]').forEach(b => b.onclick = () => {
    const a = b.dataset.a;
    if (a==='build') { S.houses[id]=Math.min(5,(S.houses[id]||0)+1); me().money-=t.h; toast(`Xây thêm ở ${t.vi}`); paintAll(); openTile(id); }
    if (a==='mort') { if (S.mortgaged.has(id)) { S.mortgaged.delete(id); me().money-=Math.ceil(t.p/2*1.1); } else { S.mortgaged.add(id); me().money+=t.p/2; } paintAll(); openTile(id); }
    if (a==='trade') { closeAll(); openTrade(o, id); }
  });
}

/* ---------- Thông tin người chơi (đối thủ / mình) ---------- */
function openPlayer(i) {
  const p = S.players[i]; const props = BOARD.filter(t=>S.owner[t.id]===i);
  const byGroup = {}; for (const t of props) (byGroup[t.g||t.type] ||= []).push(t);
  const groups = Object.entries(byGroup).map(([g, ts]) => {
    const full = GROUPS[g] ? hasSet(i, g) : false; const hex = GROUPS[g]?.hex || (g==='station'?'#27418C':'#2E6B52');
    return ts.map(t=>`<div class="prop" data-t="${t.id}"><div class="sw" style="background:${hex}"></div><div class="t">${t.vi}<small>${GROUPS[g]?.name || (g==='station'?'Bến / ga':'Công ích')}${full?' · trọn bộ':''}</small></div>
      ${S.mortgaged.has(t.id)?'<span class="m">THẾ CHẤP</span>':S.houses[t.id]?`<span class="h">${S.houses[t.id]===5?'🏨 KS':'🏠×'+S.houses[t.id]}</span>`:''}</div>`).join('');
  }).join('');
  const skills = Object.entries(p.skills).map(([id,lv]) => { const br = BRANCHES.find(b=>b.nodes.some(n=>n.id===id)); const n = br.nodes.find(n=>n.id===id);
    return `<span class="chip on" style="border-color:${br.color}">${n.ic} ${n.n} <b>lv${lv}</b></span>`; }).join('');
  const worth = p.money + props.reduce((s,t)=>s+(S.mortgaged.has(t.id)?t.p/2:t.p)+(S.houses[t.id]||0)*(t.h||0),0);
  const body = `
    <div class="kv"><span>Tiền mặt</span><b>${money(p.money)}</b></div>
    <div class="kv"><span>Tổng tài sản</span><b>${money(worth)}</b></div>
    <div class="kv"><span>Đang ở</span><b>${BOARD[p.pos].vi}${p.jail?' · tù '+p.jail+'/3':''}</b></div>
    <div class="kv"><span>Thẻ trong túi</span><b>${p.cards?p.cards+' lá (úp)':'Không'}</b></div>
    <div class="sec">Đất đai · ${props.length} ô</div>${groups||'<p style="color:var(--paper-deep)">Chưa có ô nào.</p>'}
    <div class="sec">Kỹ năng đã học</div><div class="chips">${skills||'<span class="chip">Chưa học</span>'}</div>`;
  const ft = i===S.cur ? `<button class="btn gold" data-a="manage">Quản lý tài sản</button>` : `<button class="btn gold" data-a="trade">Giao dịch với ${p.name}</button>`;
  const el = sheet('L', `<div class="tok" style="width:34px;height:34px;border-radius:50%;background:${p.color};display:grid;place-items:center;font-weight:800;font-size:15px">${p.name[0]}</div><h3>${p.name}<small>${i===S.cur?'Đang đi':'Người chơi '+(i+1)}</small></h3>`, body, ft);
  el.querySelectorAll('.prop').forEach(r => r.onclick = () => openTile(+r.dataset.t));
  const a = $('[data-a]', el); a.onclick = () => { closeAll(); a.dataset.a==='trade' ? openTrade(i) : openManage(); };
}

/* ---------- Quản lý tài sản (tấm phải) ---------- */
function openManage() {
  const props = BOARD.filter(t=>S.owner[t.id]===S.cur);
  const body = props.map(t=>`<div class="prop" data-t="${t.id}"><div class="sw" style="background:${t.g?GROUPS[t.g].hex:'#27418C'}"></div><div class="t">${t.vi}<small>${t.type==='property'?(hasSet(S.cur,t.g)?'Trọn bộ · xây được':'Chưa trọn bộ'):'Bến / công ích'}</small></div>
    ${S.mortgaged.has(t.id)?'<span class="m">THẾ CHẤP</span>':S.houses[t.id]?`<span class="h">🏠×${S.houses[t.id]}</span>`:''}<span style="color:var(--gold-deep)">›</span></div>`).join('');
  const el = sheet('R', `<h3>Quản lý tài sản<small>Chạm một ô để xây, bán, thế chấp</small></h3>`,
    `<div class="kv"><span>Tiền mặt</span><b>${money(me().money)}</b></div><div class="kv"><span>Ngân hàng còn</span><b>18 nhà · 9 KS</b></div><div class="sec">Ô của bạn</div>${body}`);
  el.querySelectorAll('.prop').forEach(r => r.onclick = () => openTile(+r.dataset.t));
}

/* ---------- Giao dịch ---------- */
function openTrade(withI, wantId) {
  if (withI==null) { return modal({eyebrow:'GIAO DỊCH', title:'Thương lượng với ai?', body:`<div class="chips">${S.players.map((p,i)=> i===S.cur?'':`<button class="chip" data-p="${i}" style="min-height:40px;font-size:11px"><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${p.color};margin-right:5px"></span>${p.name} · ${money(p.money)}</button>`).join('')}</div>`,
      buttons:[{label:'Huỷ', cls:'ghost'}]}), document.querySelectorAll('#modal [data-p]').forEach(b=>b.onclick=()=>{closeModal(); openTrade(+b.dataset.p);}); }
  const q = S.players[withI]; const want = wantId!=null ? BOARD[wantId] : null;
  modal({ wide:true, eyebrow:'ĐỀ NGHỊ GIAO DỊCH', title:`${me().name} ⇄ ${q.name}`, sub:'Chạm + để thêm ô hoặc tiền vào mỗi bên',
    body:`<div class="trade">
      <div class="col"><h4><i style="width:9px;height:9px;border-radius:50%;background:${me().color}"></i>${me().name} đưa</h4><div class="item">💵 ${money(want?want.p*1.2:150)}</div><div class="item"><span class="sw" style="background:#6B4A2F"></span>Võ Văn Kiệt</div><div class="add">+ thêm ô / tiền</div></div>
      <div class="arrow">⇄</div>
      <div class="col"><h4><i style="width:9px;height:9px;border-radius:50%;background:${q.color}"></i>${q.name} đưa</h4>${want?`<div class="item"><span class="sw" style="background:${want.g?GROUPS[want.g].hex:'#27418C'}"></span>${want.vi}</div>`:'<div class="item">🎴 1 thẻ ra tù</div>'}<div class="add">+ thêm ô / tiền</div></div>
    </div>`, buttons:[{label:'Huỷ', cls:'ghost'},{label:'Gửi đề nghị', cls:'gold', on:()=>{ toast(`Đã gửi đề nghị cho ${q.name}, chờ trả lời…`); setTimeout(()=>bcast('GIAO DỊCH', `${q.name} từ chối đề nghị của ${me().name}`), 2500); }}] });
}

/* ---------- Cây kỹ năng ---------- */
let treeTab = 0, treeSel = null;
function openTree() { treeSel = null; paintTree(); $('#tree').classList.add('on'); }
function paintTree() {
  const p = me(); const br = BRANCHES[treeTab];
  const learned = id => p.skills[id]||0;
  const canLearn = n => { if (!p.pts) return false; if (learned(n.id)>=3) return false; if (learned(n.id)) return true;
    if (n.t===1) return true; const prev = br.nodes.filter(x=>x.t===n.t-1); return prev.some(x=>learned(x.id)); };
  const tiers = [1,2,3,4].map(t => `<div class="tier"><h5>${t===4?'Tối thượng':'Cấp '+t}</h5>${br.nodes.filter(n=>n.t===t).map(n=>{ const lv=learned(n.id); const prevOk = n.t===1 || br.nodes.filter(x=>x.t===n.t-1).some(x=>learned(x.id));
    return `<button class="node${lv?' lv'+lv:''}${!lv&&!prevOk?' locked':''}${canLearn(n)?' can':''}${treeSel===n.id?' sel':''}" data-n="${n.id}" style="--c:${br.color}"><span class="ic">${n.ic}</span><span class="t"><b>${n.n}</b><small>${t===4?'1 lần / ván':n.t===1?'Gốc nhánh':'Cần cấp '+(t-1)}</small></span>${lv?`<span class="lv">LV${lv}</span>`:''}</button>`; }).join('')}</div>`).join('');
  const sel = br.nodes.find(n=>n.id===treeSel);
  const detail = sel ? `<div class="nm">${sel.ic} ${sel.n}</div><div class="meta">${br.name} · ${sel.t===4?'tối thượng':'cấp '+sel.t} · ${learned(sel.id)?'level '+learned(sel.id):'chưa học'}</div>
    <div class="desc">${sel.d}<div style="height:6px"></div>${[1,2,3].map(l=>`<div class="lv${learned(sel.id)===l?' on':''}">Lv${l} · ${sel.d.split('.')[0].toLowerCase()} ${['', 'khá hơn', 'mạnh nhất'][l-1]}</div>`).join('')}</div>
    <div class="ft"><button class="btn ghost" data-t="back">Đóng</button><button class="btn gold" data-t="up" ${canLearn(sel)?'':'disabled'}>${learned(sel.id)?'Lên level · 1 điểm':'Học · 1 điểm'}</button></div>`
    : `<div class="nm">Chọn một ô</div><div class="meta">${br.name}</div><div class="desc" style="color:var(--paper-deep)">Nhánh này có ${br.nodes.length} ô. Học ô cấp 1 trước, rồi đi lên từng cấp. Mỗi ô lên tối đa level 3.<br><br>Bạn đang có <b style="color:var(--gold-light)">${p.pts} điểm</b> chưa dùng.</div>`;
  $('#tree').innerHTML = `<div class="hd"><h2>Cây kỹ năng</h2><div id="tabs">${BRANCHES.map((b,i)=>`<button class="tab${i===treeTab?' on':''}" data-b="${i}" style="--c:${b.color}"><i></i>${b.name}<span class="n">${b.nodes.filter(n=>learned(n.id)).length}/${b.nodes.length}</span></button>`).join('')}</div>
    <span class="pts">★ ${p.pts} điểm</span><button class="x" data-close>✕</button></div>
    <div class="body"><div id="tiers">${tiers}</div><div id="detail">${detail}</div></div>`;
  $('#tree [data-close]').onclick = () => $('#tree').classList.remove('on');
  document.querySelectorAll('#tree .tab').forEach(b => b.onclick = () => { treeTab = +b.dataset.b; treeSel = null; paintTree(); });
  document.querySelectorAll('#tree .node').forEach(b => b.onclick = () => { treeSel = b.dataset.n; paintTree(); });
  const up = $('#tree [data-t="up"]'); if (up) up.onclick = () => { p.skills[treeSel] = (p.skills[treeSel]||0)+1; p.pts--; toast(`Đã học ${sel.n}`); paintTree(); paintActions(); };
  const back = $('#tree [data-t="back"]'); if (back) back.onclick = () => { treeSel = null; paintTree(); };
}

/* ---------- Hành động cột phải ---------- */
function action(k) {
  if (k==='skill') return openTree();
  if (k==='use') return modal({eyebrow:'DÙNG KỸ NĂNG', title:'Kỹ năng sẵn sàng', body:`<div class="chips"><button class="chip on" style="min-height:40px;font-size:11px">🚲 Xe Đạp · đi thêm 1–3 ô</button><button class="chip" style="min-height:40px;font-size:11px;opacity:.5">🤲 Góp Vốn · chờ 2 vòng</button></div><p style="margin-top:8px;color:var(--paper-deep)">Kỹ năng tự động (Nhặt Tiền Rơi, Tăng Ca) không cần bấm.</p>`, buttons:[{label:'Đóng', cls:'ghost'},{label:'Dùng Xe Đạp', cls:'gold', on:()=>bcast('XE ĐẠP', `${me().name} đạp thêm 2 ô`)}]});
  if (k==='bag') return modal({eyebrow:'TÚI THẺ', title:`${me().cards} lá đang giữ`, body:`<div class="reel" style="height:auto;overflow:visible;background:none"><div style="display:flex;gap:6px"><div class="cc"><b>CƠ HỘI</b>Thẻ ra tù miễn phí. Dùng khi đang ở tù.</div><div class="cc" style="opacity:.6"><b>KHÍ VẬN</b>Miễn thuê một lần. Chỉ dùng khi đạp vào đất của người khác.</div></div></div><p style="color:var(--paper-deep)">Lá mờ là chưa dùng được lúc này.</p>`, buttons:[{label:'Đóng', cls:'ghost'},{label:'Dùng lá 1', cls:'gold'}]});
  if (k==='trade') return openTrade();
  if (k==='manage') return openManage();
  if (k==='bust') return toast('Chưa cần phá sản, bạn vẫn còn tiền.');
  if (k==='jail') { me().money -= 50; me().jail = 0; bcast('RA TÙ', `${me().name} nộp 50$ ra tù`); paintAll(); }
}

/* ---------- Lắc xí ngầu & đi ---------- */
$('#btnMain').onclick = () => { if (S.busy) return; if (S.rolled && !me().jail) return endTurn(); roll(); };
function endTurn() { S.rolled = false; S.cur = (S.cur+1)%4; S.pressure = Math.min(100, S.pressure+4); paintAll(); bcast('TỚI LƯỢT', me().name); if (S.pressure>=100) setTimeout(demoEvent, 600); }
function roll() {
  S.busy = true; const dice = document.querySelectorAll('.die'); dice.forEach(d=>d.classList.add('roll'));
  let n = 0; const iv = setInterval(() => { dice.forEach(d=>d.dataset.v = 1+Math.floor(Math.random()*6)); if (++n > 8) { clearInterval(iv); finish(); } }, 90);
  function finish() {
    dice.forEach(d=>d.classList.remove('roll')); S.dice = [+dice[0].dataset.v, +dice[1].dataset.v];
    const p = me();
    if (p.jail) { if (S.dice[0]===S.dice[1]) { p.jail = 0; bcast('CẦU ĐÔI THÀNH', `${p.name} ra tù!`); move(S.dice[0]+S.dice[1]); } else { p.jail++; bcast('VẪN TRONG TÙ', `${p.name} ngồi thêm lượt`); S.rolled = true; S.busy = false; paintAll(); } return; }
    if (S.dice[0]===S.dice[1]) bcast('ĐỔ ĐÔI', `${p.name} được đi thêm lượt`);
    move(S.dice[0]+S.dice[1]);
  }
}
function move(steps) {
  const p = me(); let left = steps;
  const step = () => {
    const from = p.pos; p.pos = (p.pos+1)%40; if (p.pos===0) { p.money += 200; bcast('QUA BẮT ĐẦU', `+200$ lương`); }
    paintBoard(); const tk = $(`.tile[data-id="${p.pos}"] .tk[data-p="${S.cur}"]`); if (tk) tk.classList.add('bump');
    if (--left > 0) setTimeout(step, 130); else setTimeout(() => resolve(), 220);
  };
  setTimeout(step, 250);
}
function resolve() {
  const p = me(); const t = BOARD[p.pos]; S.rolled = true; S.busy = false; paintAll();
  if (t.ownable) { const o = owned(t.id);
    if (o==null) return offerBuy(t.id);
    if (o!==S.cur) { const r = rentOf(t.id); if (S.mortgaged.has(t.id)) return bcast('ĐẤT THẾ CHẤP', 'Không phải trả thuê');
      if (p.money < r) return shortOfMoney(r, o); p.money -= r; S.players[o].money += r; paintPlayers(); return bcast('TRẢ TIỀN THUÊ', `${p.name} trả ${money(r)} cho ${S.players[o].name}`); }
    return bcast('ĐẤT NHÀ', `${t.vi} là của bạn`); }
  if (t.type==='chance' || t.type==='chest') return drawCard(t.type);
  if (t.type==='tax') { const tx = t.id===4 ? Math.min(200, Math.round(p.money*.1)) : 100; p.money -= tx; paintPlayers(); return bcast(t.vi.toUpperCase(), `${p.name} nộp ${money(tx)}`); }
  if (t.id===30) { p.pos = 10; p.jail = 1; paintAll(); return bcast('VÀO TÙ', `${p.name} bị bắt vào Khám Lớn`); }
  if (t.id===20) return bcast('BẾN ĐẬU', 'Nghỉ chân, không mất gì');
  if (t.id===0) { p.money += 100; paintPlayers(); return bcast('ĐẠP TRÚNG BẮT ĐẦU', 'Lương ×1.5'); }
  if (t.id===10) return bcast('GHÉ THĂM', 'Chỉ ghé qua Khám Lớn');
}
function offerBuy(id) {
  const t = BOARD[id]; const p = me();
  modal({ eyebrow:'CƠ HỘI TẬU ĐẤT', title:`${t.vi}`, sub:`${t.name} · ${t.g?GROUPS[t.g].name:t.type==='station'?'Bến / ga':'Công ích'}`,
    body: deedHTML(id) + `<div class="kv" style="margin-top:6px"><span>Tiền của bạn sau khi mua</span><b class="money ${p.money-t.p<300?'neg':''}">${money(p.money-t.p)}</b></div>`,
    buttons:[{label:'Bỏ qua', cls:'ghost', on:()=>bcast('BỎ QUA', `${t.vi} vẫn của ngân hàng`)},
             {label:`Mua · ${money(t.p)}`, cls:'gold', on:()=>{ S.owner[id]=S.cur; p.money-=t.p; paintAll(); bcast('TẬU ĐẤT', `${p.name} mua ${t.vi}`); }}] });
}
function drawCard(kind) {
  const cards = CHANCE.map(c => kind==='chest' ? {...c, b:'KHÍ VẬN'} : c); const win = Math.floor(Math.random()*cards.length);
  const list = [...cards, ...cards, ...cards]; const idx = cards.length + win;
  modal({ eyebrow: kind==='chest' ? 'KHÍ VẬN' : 'CƠ HỘI', title:'Bốc thẻ…', noPeek:true,
    body:`<div class="reel"><div class="strip" id="strip">${list.map((c,i)=>`<div class="cc${i===idx?' win':''}"><b>${c.b}</b>${c.t}</div>`).join('')}</div></div><div id="cardRes" style="min-height:18px;text-align:center"></div>`,
    buttons:[{label:'Đã rõ', cls:'gold', on:()=>{ me().money += cards[win].a; paintPlayers(); bcast(cards[win].b, `${me().name} ${cards[win].a>0?'nhận':'mất'} ${money(Math.abs(cards[win].a))}`); }}] });
  requestAnimationFrame(() => requestAnimationFrame(() => { const w = $('#modal .reel').clientWidth; $('#strip').style.transform = `translateX(${w/2 - (idx*126 + 60) - 6}px)`;
    setTimeout(()=>{ const c = cards[win]; $('#cardRes').innerHTML = `<span class="money ${c.a>0?'pos':'neg'}">${c.a>0?'+':''}${money(c.a)}</span>`; }, 2300); }));
}
function shortOfMoney(need, to) {
  const p = me();
  modal({ eyebrow:'THIẾU TIỀN', title:`Còn thiếu ${money(need - p.money)}`, sub:`Phải trả ${money(need)} cho ${S.players[to].name}, bạn chỉ có ${money(p.money)}`,
    body:`<div class="sec">Gợi ý xoay tiền</div><div class="prop"><div class="sw" style="background:#27418C"></div><div class="t">Thế chấp Ga Sài Gòn<small>+100$</small></div></div><div class="prop"><div class="sw" style="background:#79B2C6"></div><div class="t">Bán 1 nhà Hai Bà Trưng<small>+25$</small></div></div>`,
    buttons:[{label:'Phá sản', cls:'red'},{label:'Quản lý tài sản', cls:'gold', on:openManage}] });
}

      <div class="voters">${S.players.map((p,i)=>`<span class="v${i===2?' done':''}" data-v="${i}"><i class="tok" style="background:${p.color}"></i>${p.name}${i===2?' ✓':''}</span>`).join('')}</div>`,

  setTimeout(()=>{ const v = $('#modal [data-v="1"]'); if (v) { v.classList.add('done'); v.append(' ✓'); } }, 2500);

/* ---------- Menu kịch bản demo ---------- */
const DEMOS = [
  ['Mua đất (Lê Lợi)', ()=>{ me().pos=32; paintAll(); offerBuy(32); }],
  ['Trả tiền thuê', ()=>{ me().pos=16; S.rolled=true; paintAll(); const r=rentOf(16); me().money-=r; S.players[2].money+=r; paintPlayers(); bcast('TRẢ TIỀN THUÊ', `${me().name} trả ${money(r)} cho Minh`); }],
  ['Bốc thẻ Cơ Hội', ()=>drawCard('chance')],
  ['Thời Cuộc: Hoả Hoạn', demoEvent],
  ['Thiếu tiền', ()=>shortOfMoney(me().money+140, 1)],
  ['Giao dịch', ()=>openTrade()],
  ['Xem đối thủ (Minh)', ()=>openPlayer(2)],
  ['Xem ô đất (Đồng Khởi)', ()=>openTile(37)],
  ['Cây kỹ năng', openTree],
  ['Thắng ván', demoWin],
  ['Đặt lại', ()=>location.reload()],
];
$('#demo').innerHTML = '<div class="cap">Kịch bản demo</div>' + DEMOS.map((d,i)=>`<button data-d="${i}">${d[0]}</button>`).join('');
document.querySelectorAll('#demo button').forEach(b => b.onclick = () => { $('#demo').classList.remove('on'); DEMOS[+b.dataset.d][1](); });
$('#btnDemo').onclick = e => { e.stopPropagation(); $('#demo').classList.toggle('on'); };
$('#app').addEventListener('click', e => { if (!e.target.closest('#demo') && !e.target.closest('#btnDemo')) $('#demo').classList.remove('on'); });
$('#btnSound').onclick = () => toast('Âm thanh: menu Nhạc / Hiệu ứng (chưa vẽ trong sketch)');

/* ---------- Khung máy tính / điện thoại thật ---------- */
const DEVICES = [
  {n:'iPhone 16 Pro', w:874, h:402, notch:'yes'}, {n:'iPhone SE', w:667, h:375, notch:'no'},
  {n:'Pixel 8', w:915, h:412, notch:'no'}, {n:'iPad mini', w:1024, h:768, notch:'no'},
];
let dev = 0;
$('#devs').insertAdjacentHTML('beforeend', DEVICES.map((d,i)=>`<button data-dev="${i}" class="${i===0?'on':''}">${d.n}</button>`).join(''));
document.querySelectorAll('[data-dev]').forEach(b => b.onclick = () => { dev = +b.dataset.dev; document.querySelectorAll('[data-dev]').forEach(x=>x.classList.toggle('on', x===b)); fit(); });
document.querySelectorAll('[data-theme]').forEach(b => b.onclick = () => { $('#app').dataset.theme = b.dataset.theme; document.querySelectorAll('[data-theme]').forEach(x=>x.classList.toggle('on', x===b)); });
function fit() {
  const vw = innerWidth, vh = innerHeight;
  const coarse = matchMedia('(pointer: coarse)').matches;
  const phoneLike = coarse || vh <= 520;
  document.body.classList.toggle('phone', phoneLike);
  document.body.classList.toggle('portrait', phoneLike && vh > vw);
  const ph = $('#phone');
  if (phoneLike) { ph.style.transform = ''; ph.style.width = ''; ph.style.height = ''; return; }
  const d = DEVICES[dev]; ph.style.width = d.w + 24 + 'px'; ph.style.height = d.h + 24 + 'px'; ph.dataset.notch = d.notch;
  const k = Math.min(1, (vw - 40) / (d.w + 24), (vh - 48 - 60) / (d.h + 24)); ph.style.transform = `scale(${k})`;
  $('#dims').textContent = `${d.n} · ${d.w}×${d.h} pt · bàn cờ ≈ ${Math.round(d.h - 12)} pt${d.notch==='yes' ? ' · đã chừa 59 pt tai thỏ mỗi bên' : ''}`;
}
addEventListener('resize', fit); addEventListener('orientationchange', () => setTimeout(fit, 150));

buildBoard(); paintAll(); fit();
bcast('TỚI LƯỢT', 'Jason · chạm Lắc xí ngầu');
</script>
