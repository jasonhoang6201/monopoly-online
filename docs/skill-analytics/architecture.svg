<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="520" viewBox="0 0 1180 520" font-family="Be Vietnam Pro, Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5B4E3E"/></marker>
    <style>
      .box{fill:#FFFDF8;stroke:#C9BBA6;stroke-width:1.5;rx:10}
      .core{fill:#FDF3E3;stroke:#E2743A}
      .net{fill:#EAF3FC;stroke:#3C8FE0}
      .db{fill:#EAF6EF;stroke:#2E9E70}
      .ui{fill:#FBEBEA;stroke:#D2463A}
      .t{fill:#1F1912} .s{fill:#5B4E3E;font-size:12px} .h{font-weight:700;font-size:15px}
      .arrow{stroke:#5B4E3E;stroke-width:1.6;fill:none;marker-end:url(#a)}
      .lbl{fill:#5B4E3E;font-size:12px;font-style:italic}
    </style>
  </defs>
  <rect width="1180" height="520" fill="#F6F1E6"/>
  <text x="24" y="34" class="t h" font-size="20">Số liệu cân bằng kỹ năng — đường đi của một sự kiện</text>
  <text x="24" y="56" class="s">Luật không biết mạng; chỉ máy cầm lái ghi; batch bất biến + khoá (game_id, client_id, seq) chống trùng; anon chỉ INSERT.</text>

  <!-- Luật -->
  <rect x="24" y="90" width="300" height="150" class="box core"/>
  <text x="40" y="116" class="t h">Luật (src/core, src/game)</text>
  <text x="40" y="140" class="t">skills.js · credit(delta có dấu) · tally()</text>
  <text x="40" y="160" class="t">learnSkill → nth · earned · point_no</text>
  <text x="40" y="180" class="t">respec · onLap · setSkillOn · offSpent</text>
  <text x="40" y="200" class="t">state.js · bankrupt · gameId</text>
  <text x="40" y="222" class="s">controller: turn (cuối lượt), gameStart/gameEnd</text>

  <!-- telemetry -->
  <rect x="380" y="90" width="230" height="150" class="box core"/>
  <text x="396" y="116" class="t h">core/telemetry.js</text>
  <text x="396" y="140" class="t">track(kind, payload)</text>
  <text x="396" y="160" class="t">seq ↑ · t_ms · ctx (game_id, lượt)</text>
  <text x="396" y="184" class="t">gate lúc phát:</text>
  <text x="396" y="202" class="t">isDriver() &amp;&amp; analytics.enabled</text>
  <text x="396" y="224" class="s">replica / bot / localhost → null</text>

  <!-- analytics -->
  <rect x="666" y="90" width="230" height="150" class="box net"/>
  <text x="682" y="116" class="t h">net/analytics.js</text>
  <text x="682" y="140" class="t">buffer → batch ≤ 200 dòng</text>
  <text x="682" y="160" class="t">hàng đợi localStorage</text>
  <text x="682" y="180" class="t">POST /rest/v1/… (anon key)</text>
  <text x="682" y="200" class="t">409 = đã có → bỏ · 5xx → gửi lại</text>
  <text x="682" y="222" class="s">pagehide: fetch keepalive ≤ 60 KB</text>

  <!-- supabase -->
  <rect x="952" y="90" width="204" height="150" class="box db"/>
  <text x="968" y="116" class="t h">Supabase Postgres</text>
  <text x="968" y="140" class="t">games (start / end)</text>
  <text x="968" y="160" class="t">game_players</text>
  <text x="968" y="180" class="t">skill_events</text>
  <text x="968" y="202" class="s">RLS: anon INSERT only</text>
  <text x="968" y="222" class="s">check biên, PK chống trùng</text>

  <path d="M324,165 L378,165" class="arrow"/>
  <path d="M610,165 L664,165" class="arrow"/>
  <path d="M896,165 L950,165" class="arrow"/>
  <text x="330" y="150" class="lbl">track()</text>
  <text x="616" y="150" class="lbl">onPush</text>
  <text x="902" y="150" class="lbl">REST</text>

  <!-- views / rpc -->
  <rect x="952" y="290" width="204" height="120" class="box db"/>
  <text x="968" y="316" class="t h">view v_* + stats_*()</text>
  <text x="968" y="340" class="t">v_learn (gộp trùng theo nth)</text>
  <text x="968" y="360" class="t">v_hold · v_use · v_player_skill</text>
  <text x="968" y="380" class="t">stats_skills / branches /</text>
  <text x="968" y="398" class="t">respec / points / overview</text>
  <path d="M1054,242 L1054,288" class="arrow"/>
  <text x="1062" y="268" class="lbl">security definer</text>

  <!-- dashboard -->
  <rect x="666" y="290" width="230" height="120" class="box ui"/>
  <text x="682" y="316" class="t h">/stats.html</text>
  <text x="682" y="340" class="t">supabase.rpc('stats_*', bộ lọc)</text>
  <text x="682" y="360" class="t">bảng + thanh ngang CSS</text>
  <text x="682" y="380" class="t">sắp xếp · lọc ngày / chế độ / n</text>
  <text x="682" y="400" class="s">tên ô lấy từ data/skills.js</text>
  <path d="M950,350 L898,350" class="arrow"/>

  <!-- sự kiện -->
  <rect x="24" y="290" width="586" height="190" class="box"/>
  <text x="40" y="316" class="t h">Sự kiện (kind)</text>
  <text x="40" y="342" class="t"><tspan font-weight="700">learn</tspan>  level · cost · lap · nth (lần học thứ mấy) · earned · point_no (điểm thứ mấy) · off_turn</text>
  <text x="40" y="364" class="t"><tspan font-weight="700">use</tspan>  delta có dấu (thua cược âm) · gain · counted</text>
  <text x="40" y="386" class="t"><tspan font-weight="700">respec</tspan>  wiped[{id, lv}] · refund · fee      <tspan font-weight="700">toggle</tspan>  on · auto</text>
  <text x="40" y="408" class="t"><tspan font-weight="700">lap</tspan>  points · points_now · money      <tspan font-weight="700">points</tspan>  (thẻ)      <tspan font-weight="700">bankrupt</tspan>  cây lúc vỡ nợ</text>
  <text x="40" y="430" class="t"><tspan font-weight="700">turn</tspan>  một dòng mỗi lượt: tiền mặt cả bàn</text>
  <text x="40" y="460" class="s">Tổng kết ván: games.end (win_by, turns, rounds) · game_players (rank, money, net_worth, điểm nhận/tiêu/thừa, cây cuối ván)</text>
</svg>
